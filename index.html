<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.cdnfonts.com/css/digital-7-mono" rel="stylesheet">

<style>
body{
  margin:0;
  background:transparent;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

/* ==== WIDGET CONTAINER (with perspective) ==== */
.widget{
  position:relative;
  width:700px;
  aspect-ratio:1/1;
  background:url("clock2.jpg") no-repeat center/cover;
  perspective:900px;
}

/* ==== VISOR DISPLAY ==== */
.display{
  position:absolute;
  top:110px;
  left:56px;
  width:280px;
  text-align:center;

  transform-origin: left center;
  transform: skewX(-25deg) rotate(-30deg) rotateY(-12deg);

  font-family:'Digital-7 Mono', monospace;
  color:#ff2a2a;
  text-shadow:
    0 0 5px #ff0000,
    0 0 10px #ff0000,
    0 0 20px #ff0000;
}

/* ==== NUMBERS ==== */
#stopwatch{
  font-size: 52px;
  letter-spacing: 5px;
  margin-bottom: 6px;
}

/* ==== BUTTON GROUP (also transformed!) ==== */
.controls{
  display:flex;
  justify-content:center;
  gap:14px;

  /* Make buttons follow the same exact angle */
  transform-origin: left center;
  transform: skewX(-25deg) rotate(-30deg) rotateY(-12deg);

  /* Counter-skew to keep text readable */
  /* (undo the rotation for readability) */
}

.controls button{
  font-family:'Digital-7 Mono', monospace;
  font-size:16px;
  background:transparent;
  border:none;
  color:#ff2a2a;
  cursor:pointer;
  letter-spacing:2px;

  /* Glow */
  text-shadow:
    0 0 5px #ff0000,
    0 0 10px #ff0000;

  /* Slight opacity for realism */
  opacity:0.85;
}

.controls button:hover{
  opacity:1;
  transform: scale(1.08);
}
</style>
</head>

<body>

<div class="widget">
  <div class="display">

      <div id="stopwatch">00:00</div>

      <!-- CONTROLS (inherit visor angle) -->
      <div class="controls">
        <button onclick="startStop()">START</button>
        <button onclick="reset()">RESET</button>
      </div>

  </div>
</div>

<script>
let timer;
let isRunning = false;
let seconds = 0;

function updateDisplay() {
  let mins = String(Math.floor(seconds / 60)).padStart(2, "0");
  let secs = String(seconds % 60).padStart(2, "0");
  document.getElementById("stopwatch").textContent = `${mins}:${secs}`;
}

function startStop() {
  if (isRunning) {
    clearInterval(timer);
  } else {
    timer = setInterval(() => {
      seconds++;
      updateDisplay();
    }, 1000);
  }
  isRunning = !isRunning;
}

function reset() {
  clearInterval(timer);
  seconds = 0;
  updateDisplay();
  isRunning = false;
}

updateDisplay();
</script>

</body>
</html>
