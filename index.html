<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.cdnfonts.com/css/digital-7-mono" rel="stylesheet">

<style>
body{
  margin:0;
  background:transparent;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

/* ==== WIDGET CONTAINER ==== */
.widget{
  position:relative;
  width:700px;
  aspect-ratio:1/1;
  background:url("clock2.jpg") no-repeat center/cover;
  perspective:900px; /* keep this, does not move anything */
}

/* ==== VISOR (your original perfect position) ==== */
.display{
  position:absolute;
  top:110px;
  left:56px;
  width:280px;
  text-align:center;

  /* Your original skew + rotation */
  transform-origin:left center;
  transform: skewX(-25deg) rotate(-30deg);

  font-family:'Digital-7 Mono', monospace;
  color:#ff2a2a;
  text-shadow:
    0 0 5px #ff0000,
    0 0 10px #ff0000,
    0 0 20px #ff0000;
  z-index:50;
}

/* ==== NUMBERS ==== */
#stopwatch{
  font-size: 52px;
  letter-spacing: 5px;
  margin-bottom:6px;
  position:relative;
  z-index:100; /* ensure numbers stay in front */
}

/* ==== CONTROLS (kept in original correct position) ==== */
.controls{
  display:flex;
  justify-content:center;
  gap:14px;
  position:relative;
  z-index:90; /* placed above background but below numbers */
}

/* ==== BUTTONS ==== */
.controls button{
  font-family:'Digital-7 Mono', monospace;
  font-size:16px;
  background:transparent;
  border:none;
  color:#ff2a2a;
  cursor:pointer;
  letter-spacing:2px;

  /* Glow */
  text-shadow:
    0 0 4px #ff0000,
    0 0 8px #ff0000;

  /* Fake 3D effect so they blend with the visor angle */
  transform: skewX(8deg);
}

.controls button:hover{
  opacity:0.8;
}
</style>
</head>

<body>

<div class="widget">
  <div class="display">
      <div id="stopwatch">00:00</div>

      <div class="controls">
        <button onclick="startStop()">START</button>
        <button onclick="reset()">RESET</button>
      </div>

  </div>
</div>

<script>
let timer;
let isRunning = false;
let seconds = 0;

function updateDisplay() {
  let mins = String(Math.floor(seconds / 60)).padStart(2, "0");
  let secs = String(seconds % 60).padStart(2, "0");
  document.getElementById("stopwatch").textContent = `${mins}:${secs}`;
}

function startStop() {
  if (isRunning) {
    clearInterval(timer);
  } else {
    timer = setInterval(() => {
      seconds++;
      updateDisplay();
    }, 1000);
  }
  isRunning = !isRunning;
}

function reset() {
  clearInterval(timer);
  seconds = 0;
  updateDisplay();
  isRunning = false;
}

updateDisplay();
</script>

</body>
</html>
