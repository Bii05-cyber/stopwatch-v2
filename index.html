<!DOCTYPE html> 
<html> 
<head> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  
<link href="https://fonts.cdnfonts.com/css/digital-7-mono" rel="stylesheet"> 
  
<style> 
body{ 
  margin:0; 
  background:transparent; 
  display:flex; 
  justify-content:center; 
  align-items:center; 
  height:100vh; 
} 
  
.widget{ 
  position:relative; 
  width:350px; 
  aspect-ratio:1/1; 
  background:url("clock2.jpg") no-repeat center/cover;
}
  
.display{ 
  position:absolute; 
  top:55px; 
  left:28px; 
  width:140px; 
  text-align:center; 
  transform: skewX(-6deg); 
  font-family:'Digital-7 Mono', monospace; 
  color:#ff2a2a; 
  text-shadow: 0 0 5px #ff0000, 0 0 10px #ff0000, 0 0 20px #ff0000; 
  transform: skewX(-25deg) rotate(-30deg); 
} 
  
#stopwatch{ 
  font-size: 26px; 
  letter-spacing: 2px; 
} 
  
.controls{ 
  margin-top: 4px; 
  display: flex; 
  justify-content: center; 
  gap: 1px;
} 
  
.controls button{ 
  font-family:'Digital-7 Mono', monospace; 
  font-size:8px; 
  background:transparent; 
  border:none; 
  color:#ff2a2a; 
  cursor:pointer; 
  letter-spacing:1px; 
  text-shadow: 0 0 5px #ff0000, 0 0 10px #ff0000; 
} 
  
.controls button:hover{ 
  opacity:0.7; 
} 
</style> 
</head> 
  
<body> 
  
<div class="widget"> 
  <div class="display"> 
    <div id="stopwatch">00:00</div> 
    <div class="controls"> 
      <button onclick="startStop()">START</button> 
      <button onclick="reset()">RESET</button> 
    </div> 
  </div> 
</div> 
  
<script> 
// --- NON-FREEZING STOPWATCH ENGINE ---
let startTime = null;   // when the stopwatch started running
let elapsed = 0;        // total elapsed time in ms
let isRunning = false;  
let rafId = null;       // animation frame reference

function updateDisplay() {
  let total = elapsed;
  let mins = String(Math.floor(total / 60000)).padStart(2, "0");
  let secs = String(Math.floor((total % 60000) / 1000)).padStart(2, "0");

  // Change this selector if your stopwatch ID is different
  document.getElementById("stopwatch").textContent = `${mins}:${secs}`;
}

function tick() {
  if (!isRunning) return;
  elapsed = Date.now() - startTime;  // calculate true elapsed time
  updateDisplay();
  rafId = requestAnimationFrame(tick); // refresh again
}

function startStop() {
  if (isRunning) {
    isRunning = false;
    cancelAnimationFrame(rafId);
  } else {
    startTime = Date.now() - elapsed;  // continue from previous elapsed
    isRunning = true;
    tick(); // begin ticking
  }
}

function reset() {
  isRunning = false;
  cancelAnimationFrame(rafId);
  elapsed = 0;
  updateDisplay();
}

updateDisplay();  // initialize
</script> 

</body> 
</html>
